repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  # Prettier only on the files this fork added, so upstream files are not reformatted.
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        files: ^(\.github/|hub-extras/.*\.(md|ya?ml)$)
